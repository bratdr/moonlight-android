name: Build Moonlight with Keyboard Accessibility

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android NDK & SDK
      run: |
        export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        echo "Accepting licenses and installing NDK 26.2..."
        yes | sdkmanager --licenses || true
        yes | sdkmanager "ndk;26.2.11394342" "build-tools;34.0.0" "platforms;android-34" || true
        NDK_DIR=$(find $ANDROID_HOME/ndk -maxdepth 1 -name "26.2.*" 2>/dev/null | head -n 1)
        if [ -z "$NDK_DIR" ]; then NDK_DIR="$ANDROID_HOME/ndk/26.2.11394342"; fi
        echo "ndk.dir=$NDK_DIR" > local.properties
        echo "sdk.dir=$ANDROID_HOME" >> local.properties
        cat local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleNonRootRelease

    - name: Sign APK
      run: |
        export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
        APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
        echo "Using apksigner at: $APKSIGNER"
        keytool -genkey -v -keystore my-release-key.keystore -alias temp_key -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=MoonlightKeyboardBuild"
        UNSIGNED_APK=$(find app/build/outputs/apk/ -name "*unsigned.apk" 2>/dev/null | head -n 1)
        if [ -z "$UNSIGNED_APK" ]; then
          UNSIGNED_APK=$(find app/build/outputs/apk/ -name "*.apk" 2>/dev/null | head -n 1)
        fi
        echo "Signing APK: $UNSIGNED_APK"
        $APKSIGNER sign --ks my-release-key.keystore --ks-key-alias temp_key --ks-pass pass:password --key-pass pass:password --out Moonlight-Keyboard-Release.apk "$UNSIGNED_APK"
        ls -lh Moonlight-Keyboard-Release.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Moonlight-Keyboard-Release
        path: Moonlight-Keyboard-Release.apk
